# Runs the web app. Set up the Convex backend first: docs/CONVEX_SETUP.md.
# Build the checkout: docker compose -f docker-compose.convex.yml up -d --build
services:
  app:
    image: ${SOUS_CHEF_IMAGE:-sous-chef:local}
    build: .
    restart: unless-stopped
    environment:
      # Public browser-reachable API URL, NOT a deploy/admin key.
      CONVEX_URL: ${CONVEX_URL:-${NEXT_PUBLIC_CONVEX_URL:?Set NEXT_PUBLIC_CONVEX_URL in .env}}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
