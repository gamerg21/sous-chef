# Disposable public demo only. Never use this configuration for a personal kitchen.
services:
  - type: web
    name: souschef-demo
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /bin/sh -c 'export APP_URL="$RENDER_EXTERNAL_URL"; exec node --max-old-space-size=384 server.js'
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: SOUS_CHEF_DEMO
        value: 'true'
      - key: SOUS_CHEF_ALLOW_SIGNUP
        value: 'false'
      - key: SOUS_CHEF_DATA_DIR
        value: /data
      - key: COMMUNITY_API_URL
        value: ''
      - key: COMMUNITY_CONVEX_URL
        value: ''
